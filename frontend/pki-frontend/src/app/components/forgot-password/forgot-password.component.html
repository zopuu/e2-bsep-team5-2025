<div class="forgot-password-container">
  <div class="forgot-password-card">
    <h2>Forgot Password?</h2>
    <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
      
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          placeholder="Enter your email"
          class="form-control"
          [class.error]="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid"
        >
        <div class="error-message" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.hasError('required')">
          Email is required
        </div>
        <div class="error-message" *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.hasError('email')">
          Please enter a valid email address
        </div>
      </div>

      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading || !forgotPasswordForm.valid"
      >
        <span *ngIf="isLoading">Sending...</span>
        <span *ngIf="!isLoading">Send Reset Link</span>
      </button>

      <div class="message" [class]="messageType" *ngIf="message">
        {{ message }}
      </div>

    </form>

    <div class="back-to-login">
      <a (click)="goToLogin()">Back to Login</a>
    </div>
  </div>
</div>
