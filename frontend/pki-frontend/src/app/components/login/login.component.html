<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Login</h2>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>
        <small *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email</small>
      </div>
    </div>

    <div>
      <label for="password">Password</label>
      <div class="password-input-wrapper">
        <input 
          id="password" 
          [type]="showPassword ? 'text' : 'password'" 
          formControlName="password" 
        />
        <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()">
          {{ showPassword ? '👁️' : '👁️‍🗨️' }}
        </button>
      </div>
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        <small>Password is required</small>
      </div>
    </div>

    <!-- Custom Arithmetic CAPTCHA -->
    <div class="captcha-container">
      <div class="captcha-question">
        <strong>Solve: {{ captchaQuestion }} = ?</strong>
      </div>
      <input 
        type="number" 
        [(ngModel)]="captchaAnswer" 
        [ngModelOptions]="{standalone: true}"
        (ngModelChange)="checkCaptchaAnswer()"
        placeholder="Enter answer"
        class="captcha-input"
        [disabled]="captchaSolved">
      <button 
        type="button" 
        (click)="generateCaptcha()" 
        class="captcha-refresh-btn">
        🔄 New Question
      </button>
      <div *ngIf="captchaError" class="captcha-error">
        {{ captchaError }}
      </div>
    </div>

    <button type="submit" [disabled]="isLoading || !captchaSolved">Login</button>

    <p *ngIf="message" [class]="messageType">{{ message }}</p>

    <div class="forgot-password-link">
      <a routerLink="/forgot-password">Forgot Password?</a>
    </div>

    <div class="signup-link">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </form>
</div>
