<div class="reset-password-container">
  <div class="reset-password-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-password-form">
      
      <div class="form-group">
        <label for="password">New Password *</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password"
            placeholder="Enter your new password"
            class="form-control"
            [class.error]="getFieldError('password')"
          >
          <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div class="error-message" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password *</label>
        <div class="password-input-wrapper">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            id="confirmPassword" 
            formControlName="confirmPassword"
            placeholder="Confirm your new password"
            class="form-control"
            [class.error]="getFieldError('confirmPassword')"
          >
          <button type="button" class="toggle-password-btn" (click)="toggleConfirmPasswordVisibility()">
            {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div class="error-message" *ngIf="getFieldError('confirmPassword')">
          {{ getFieldError('confirmPassword') }}
        </div>
      </div>

      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading || !resetPasswordForm.valid"
      >
        <span *ngIf="isLoading">Resetting...</span>
        <span *ngIf="!isLoading">Reset Password</span>
      </button>

      <div class="message" [class]="messageType" *ngIf="message">
        {{ message }}
      </div>

    </form>

    <div class="back-to-login">
      <a (click)="goToLogin()">Back to Login</a>
    </div>
  </div>
</div>
